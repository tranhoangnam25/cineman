spring.application.name=cineman1-backend
server.port=8080

# Datasource - mac dinh dung H2 dang file khi chay local.
# Khi deploy, dat 3 bien moi truong sau de dung PostgreSQL (Neon):
#   SPRING_DATASOURCE_URL=jdbc:postgresql://<host>/<db>?sslmode=require
#   SPRING_DATASOURCE_USERNAME=<user>
#   SPRING_DATASOURCE_PASSWORD=<password>
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/cineman1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA / Hibernate - tao bang theo @Table(name=...)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 console (chi dung khi chay voi H2 local)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Jackson - dinh dang ngay gio
spring.jackson.time-zone=Asia/Ho_Chi_Minh
